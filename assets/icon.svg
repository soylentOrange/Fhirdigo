<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2c3440" />
      <stop offset="100%" stop-color="#14181f" />
    </radialGradient>

    <!-- Outer Flame Gradient -->
    <linearGradient id="outerFlame" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#C62828" />
      <stop offset="40%" stop-color="#E53935" />
      <stop offset="80%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Inner Flame Gradient -->
    <linearGradient id="innerFlame" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFEB3B" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <linearGradient id="coreFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#3a4454" stroke-width="3" />

  <!-- FHIR Flame Graphic Group -->
  <g transform="translate(0, -10)">
    <!-- Outer Flame -->
    <path filter="url(#flameGlow)" fill="url(#outerFlame)" d="
      M 256, 70
      C 265, 120 300, 160 340, 205
      C 385, 255 405, 305 390, 365
      C 372, 435 295, 455 256, 455
      C 217, 455 140, 435 122, 365
      C 107, 305 127, 255 172, 205
      C 212, 160 247, 120 256, 70 Z
    " />

    <!-- Left secondary tongue -->
    <path fill="url(#outerFlame)" opacity="0.9" d="
      M 256, 170
      C 210, 220 160, 260 145, 320
      C 135, 360 155, 395 180, 410
      C 150, 385 145, 340 165, 300
      C 185, 260 225, 220 256, 170 Z
    " />

    <!-- Right secondary tongue -->
    <path fill="url(#outerFlame)" opacity="0.9" d="
      M 256, 150
      C 290, 200 345, 245 355, 305
      C 365, 360 330, 400 305, 415
      C 335, 385 340, 340 325, 295
      C 310, 250 280, 205 256, 150 Z
    " />

    <!-- Inner Flame -->
    <path fill="url(#innerFlame)" d="
      M 256, 160
      C 262, 195 290, 235 315, 275
      C 345, 320 350, 365 330, 405
      C 305, 445 270, 448 256, 448
      C 242, 448 207, 445 182, 405
      C 162, 365 167, 320 197, 275
      C 222, 235 250, 195 256, 160 Z
    " />

    <!-- Core Flame Tongue -->
    <path fill="url(#coreFlame)" opacity="0.95" d="
      M 256, 235
      C 260, 265 280, 300 292, 335
      C 305, 370 295, 405 280, 425
      C 268, 440 260, 442 256, 442
      C 252, 442 244, 440 232, 425
      C 217, 405 207, 370 220, 335
      C 232, 300 252, 265 256, 235 Z
    " />

    <!-- White Medical Cross in Core -->
    <g fill="#D83A14" opacity="0.9">
      <rect x="246" y="325" width="20" height="60" rx="4" />
      <rect x="226" y="345" width="60" height="20" rx="4" />
    </g>
  </g>
</svg>

